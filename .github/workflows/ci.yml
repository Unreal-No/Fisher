name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fisher
          POSTGRES_PASSWORD: fisher
          POSTGRES_DB: fisher_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fisher"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # API tests TRUNCATE tables: the database name must end with _test (guarded in test setup)
      DATABASE_URL: postgresql://fisher:fisher@localhost:5432/fisher_test
      TEST_DATABASE_URL: postgresql://fisher:fisher@localhost:5432/fisher_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test (shared, API integration on Postgres, web)
        run: pnpm test
      - name: Build
        run: pnpm build
