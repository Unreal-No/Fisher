name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fisher
          POSTGRES_PASSWORD: fisher
          POSTGRES_DB: fisher_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fisher -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # API tests TRUNCATE tables: the database name must end with _test (guarded in test setup)
      DATABASE_URL: postgresql://fisher:fisher@localhost:5432/fisher_test
      TEST_DATABASE_URL: postgresql://fisher:fisher@localhost:5432/fisher_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test (shared, API integration on Postgres, web)
        run: pnpm test
      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fisher
          POSTGRES_PASSWORD: fisher
          POSTGRES_DB: fisher_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fisher -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://fisher:fisher@localhost:5432/fisher_e2e
      SEED_DEMO_DATA: 'true'
      SEED_ADMIN_PASSWORD: Admin@12345
      COOKIE_SECURE: 'false'
      CORS_ORIGINS: http://localhost:4173
      STORAGE_LOCAL_DIR: /tmp/fisher-storage
      # several logins per test run from one IP
      LOGIN_RATE_LIMIT: '200'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter @fisher/web exec playwright install --with-deps chromium
      - name: Build
        run: pnpm build
      - name: Database (migrate + demo seed)
        run: |
          pnpm db:deploy
          # same key for the seed (this step) and the server (later steps; GITHUB_ENV applies to later steps only)
          export APP_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          echo "::add-mask::$APP_ENCRYPTION_KEY"
          echo "APP_ENCRYPTION_KEY=$APP_ENCRYPTION_KEY" >> "$GITHUB_ENV"
          node apps/api/dist/seed.js
      - name: End-to-end tests (Playwright)
        env:
          CI: 'true'
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
